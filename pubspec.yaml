name: star_prnt_flutter
description: A Flutter package for Star Micronics thermal printers supporting network, USB, and Bluetooth connectivity using the StarPRNT protocol.
version: 1.1.0
homepage: https://github.com/yourusername/star_prnt_flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rootsnk.flutter_star
        pluginClass: StarPrntFlutterPlugin
      ios:
        pluginClass: StarPrntFlutterPlugin
